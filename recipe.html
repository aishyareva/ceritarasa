<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resep - CeritaRasa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .recipe-hero {
      position: relative;
      height: 280px;
      overflow: hidden;
    }
    .recipe-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .recipe-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,.7) 0%, transparent 50%);
    }
    .hero-actions {
      position: absolute;
      top: var(--sp-4);
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--sp-4);
    }
    .hero-action-btn {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,.9);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--clr-text);
      font-size: 1.1rem;
      transition: all var(--transition);
      backdrop-filter: blur(8px);
    }
    .hero-action-btn:hover { transform: scale(1.05); }
    .recipe-meta-card {
      margin: -24px var(--sp-4) 0;
      background: var(--clr-surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: var(--sp-4);
      position: relative;
      z-index: 2;
    }
    .recipe-title {
      font-family: var(--ff-display);
      font-size: var(--fz-2xl);
      font-weight: 700;
      line-height: 1.2;
    }
    .recipe-origin { color: var(--clr-text-3); font-size: var(--fz-sm); margin-top: 4px; }
    .recipe-stats {
      display: flex;
      gap: var(--sp-4);
      margin-top: var(--sp-4);
      padding-top: var(--sp-4);
      border-top: 1px solid var(--clr-border);
    }
    .stat-item { flex: 1; text-align: center; }
    .stat-value {
      font-size: var(--fz-md);
      font-weight: 700;
      color: var(--clr-text);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .stat-label { font-size: var(--fz-xs); color: var(--clr-text-3); margin-top: 2px; }
    .stat-divider { width: 1px; background: var(--clr-border); align-self: stretch; }
    .tab-area { padding: var(--sp-4); }
    .tab-content { margin-top: var(--sp-4); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .ingredient-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--clr-border);
      gap: var(--sp-3);
    }
    .ingredient-item:last-child { border-bottom: none; }
    .ingr-name { font-weight: 500; font-size: var(--fz-sm); }
    .ingr-amount { font-size: var(--fz-sm); color: var(--clr-text-3); white-space: nowrap; }
    .ingr-alt {
      font-size: var(--fz-xs);
      color: var(--clr-accent);
      margin-top: 2px;
    }
    .alt-toggle {
      display: none;
    }
    .alt-toggle.has-alt { display: block; }
    .step-item {
      display: flex;
      gap: var(--sp-3);
      margin-bottom: var(--sp-4);
    }
    .step-num {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--clr-primary);
      color: #fff;
      font-size: var(--fz-sm);
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .step-text { font-size: var(--fz-sm); line-height: 1.6; color: var(--clr-text); }
    .yt-embed {
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 16/9;
      background: #000;
    }
    .yt-embed iframe { width: 100%; height: 100%; border: none; }
    .yt-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: 0.75rem;
      background: #FF0000;
      color: #fff;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: var(--fz-sm);
      margin-top: var(--sp-4);
      text-decoration: none;
    }
    .history-block {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
      margin-bottom: var(--sp-3);
    }
    .history-block .hb-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-md);
      background: rgba(107,42,14,.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--clr-primary);
      margin-bottom: var(--sp-3);
    }
    .history-block .hb-title {
      font-weight: 700;
      font-size: var(--fz-sm);
      color: var(--clr-text);
      margin-bottom: var(--sp-2);
    }
    .history-block p { font-size: var(--fz-sm); color: var(--clr-text-2); line-height: 1.6; }
    .section-sub { font-size: var(--fz-md); font-weight: 700; color: var(--clr-text); margin-bottom: var(--sp-3); }
    .show-alt-btn {
      font-size: var(--fz-xs);
      color: var(--clr-accent);
      font-weight: 600;
      padding: 2px 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>
<div class="page-wrapper">
  <div id="recipe-wrap" class="animate-in"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/recipe.js"></script>
</body>
</html>
