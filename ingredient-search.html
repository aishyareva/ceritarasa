<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari dari Bahan - CeritaRasa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .ingr-input-area {
      background: var(--clr-surface);
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-3);
    }
    .ingr-input-row {
      display: flex;
      gap: var(--sp-2);
    }
    .ingr-tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-top: var(--sp-3);
    }
    .ingr-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.3rem 0.75rem;
      background: rgba(107,42,14,.08);
      border: 1.5px solid rgba(107,42,14,.2);
      border-radius: var(--radius-full);
      font-size: var(--fz-xs);
      font-weight: 600;
      color: var(--clr-primary);
    }
    .ingr-tag button { color: var(--clr-primary); font-size: 1rem; line-height: 1; }
    .match-bar {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-2);
    }
    .match-label { font-size: var(--fz-xs); color: var(--clr-text-2); white-space: nowrap; }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--sp-2);
      margin-top: var(--sp-3);
    }
    .suggestion-chip {
      padding: 0.3rem 0.75rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--clr-border);
      font-size: var(--fz-xs);
      color: var(--clr-text-2);
      cursor: pointer;
      transition: all var(--transition);
      background: var(--clr-surface);
    }
    .suggestion-chip:hover { border-color: var(--clr-accent); color: var(--clr-accent); }
  </style>
</head>
<body class="has-bottom-nav">
<div class="page-wrapper">
  <div class="page-header with-border">
    <div class="d-flex align-center justify-between">
      <span class="section-title" data-i18n="ingr_search">Cari dari Bahan</span>
      <div class="lang-toggle">
        <button class="lang-btn" data-lang="id">ID</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>
  </div>

  <div class="page-content" style="padding:var(--sp-4);">
    <p class="text-sm text-muted mb-4">Masukkan bahan yang kamu punya, kami carikan resepnya.</p>

    <div class="ingr-input-area mb-4">
      <div class="ingr-input-row">
        <input class="form-input flex-1" id="ingr-input" data-i18n-ph="ingr_ph" placeholder="Tambah bahan..." style="border:none;padding-left:0;background:transparent;">
        <button class="btn btn-primary btn-sm" id="btn-add-ingr" data-i18n="ingr_add">Tambah</button>
      </div>
      <div class="ingr-tag-list" id="ingr-tags"></div>
    </div>

    <div class="suggestions" id="suggestions"></div>

    <button class="btn btn-primary btn-full mt-4" id="btn-find" data-i18n="ingr_find">Cari Resep</button>

    <div id="results-section" style="margin-top:var(--sp-6);display:none;">
      <div class="section-title mb-4" data-i18n="ingr_result">Rekomendasi Resep</div>
      <div id="ingr-results" class="d-flex flex-col gap-3"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="bi bi-house"></i><span data-i18n="nav_home">Beranda</span></a>
    <a href="map.html" class="nav-item"><i class="bi bi-map"></i><span data-i18n="nav_map">Peta</span></a>
    <a href="ingredient-search.html" class="nav-item"><i class="bi bi-basket3"></i><span>Bahan</span></a>
    <a href="favorites.html" class="nav-item"><i class="bi bi-heart"></i><span data-i18n="nav_fav">Favorit</span></a>
    <a href="profile.html" class="nav-item"><i class="bi bi-person"></i><span data-i18n="nav_profile">Profil</span></a>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/ingredient-search.js"></script>
</body>
</html>
