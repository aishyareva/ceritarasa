<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuliner Provinsi - CeritaRasa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .prov-hero {
      background: linear-gradient(135deg, var(--clr-primary) 0%, #3D1508 100%);
      padding: var(--sp-5) var(--sp-4);
      color: #fff;
    }
    .prov-hero .name {
      font-family: var(--ff-display);
      font-size: var(--fz-2xl);
      font-weight: 700;
    }
    .prov-hero .island {
      font-size: var(--fz-sm);
      opacity: .7;
      margin-top: 4px;
    }
  </style>
</head>
<body class="has-bottom-nav">
<div class="page-wrapper">
  <div class="prov-hero">
    <a href="map.html" class="back-btn" style="color:rgba(255,255,255,.8);margin-bottom:var(--sp-3);display:inline-flex;">
      <i class="bi bi-arrow-left"></i> <span data-i18n="back">Kembali</span>
    </a>
    <div class="name" id="prov-name"></div>
    <div class="island" id="prov-island"></div>
  </div>

  <div class="page-content animate-in" style="padding:var(--sp-4);">
    <div class="section-title mb-4" data-i18n="province_food">Kuliner Khas</div>
    <div id="prov-recipes" class="d-flex flex-col gap-3"></div>
  </div>

  <nav class="bottom-nav">
    <a href="home.html" class="nav-item"><i class="bi bi-house"></i><span data-i18n="nav_home">Beranda</span></a>
    <a href="map.html" class="nav-item"><i class="bi bi-map"></i><span data-i18n="nav_map">Peta</span></a>
    <a href="ingredient-search.html" class="nav-item"><i class="bi bi-basket3"></i><span>Bahan</span></a>
    <a href="favorites.html" class="nav-item"><i class="bi bi-heart"></i><span data-i18n="nav_fav">Favorit</span></a>
    <a href="profile.html" class="nav-item"><i class="bi bi-person"></i><span data-i18n="nav_profile">Profil</span></a>
  </nav>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  App.initBottomNav();
  const provId = App.getParam('id');
  const prov   = DB.provinces.find(p => p.id === provId);
  const island = DB.islands.find(isl => isl.id === prov?.island);

  if (!prov) { location.href = 'map.html'; return; }

  document.getElementById('prov-name').textContent   = prov.name;
  document.getElementById('prov-island').textContent = island?.name || '';
  document.title = `${prov.name} - CeritaRasa`;

  const recipes = DB.getByProv(provId);
  const el = document.getElementById('prov-recipes');
  if (!recipes.length) {
    el.innerHTML = `<div class="empty-state"><i class="bi bi-bowl"></i><p>Resep dari ${prov.name} segera hadir!</p></div>`;
  } else {
    el.innerHTML = recipes.map(r => App.recipeCardH(r, i18n.lang)).join('');
  }
});
</script>
</body>
</html>
