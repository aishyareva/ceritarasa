<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CeritaRasa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/onboarding.css">
</head>
<body>
<div class="page-wrapper">
  <div class="onb-wrap">
    <div class="onb-top">
      <span class="onb-logo">CeritaRasa</span>
      <button class="btn btn-ghost btn-sm" id="btn-skip" data-i18n="onb_skip">Lewati</button>
    </div>

    <div class="onb-slides" id="onb-slides">
      <div class="onb-slide">
        <div class="onb-visual hero-food hero-1"><div class="luxury-overlay"></div></div>
        <h1 data-i18n="onb_title1">Jelajahi Kekayaan Kuliner Nusantara</h1>
        <p data-i18n="onb_desc1">Temukan makanan khas dari berbagai daerah di Indonesia.</p>
      </div>
      <div class="onb-slide">
        <div class="onb-visual hero-food hero-2"><div class="luxury-overlay"></div></div>
        <h1 data-i18n="onb_title2">Resep Lengkap &amp; Praktis</h1>
        <p data-i18n="onb_desc2">Dapatkan bahan, langkah memasak, dan alternatif bahan dengan mudah.</p>
      </div>
      <div class="onb-slide">
        <div class="onb-visual hero-food hero-3"><div class="luxury-overlay"></div></div>
        <h1 data-i18n="onb_title3">Kenali Sejarah &amp; Budaya Kuliner</h1>
        <p data-i18n="onb_desc3">Pelajari cerita dan nilai budaya dari setiap makanan tradisional.</p>
      </div>
    </div>

    <div class="onb-footer">
      <div class="onb-dots" id="onb-dots">
        <div class="onb-dot active"></div>
        <div class="onb-dot"></div>
        <div class="onb-dot"></div>
      </div>
      <div class="onb-actions">
        <button class="btn btn-primary btn-full" id="btn-next" data-i18n="onb_next">Lanjut</button>
      </div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
  (function() {
    let current = 0;
    const total = 3;
    const slides = document.getElementById('onb-slides');
    const dots   = document.querySelectorAll('.onb-dot');
    const btnNext = document.getElementById('btn-next');
    const btnSkip = document.getElementById('btn-skip');

    function goTo(idx) {
      current = idx;
      slides.style.transform = `translateX(-${current * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === current));
      btnNext.dataset.i18n = current === total - 1 ? 'onb_start' : 'onb_next';
      i18n.apply();
    }

    btnNext.addEventListener('click', () => {
      if (current < total - 1) { goTo(current + 1); }
      else { App.onboarding.setDone(); location.href = 'auth.html'; }
    });

    btnSkip.addEventListener('click', () => {
      App.onboarding.setDone();
      location.href = 'auth.html';
    });

    goTo(0);
  })();
</script>
</body>
</html>
