<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - CeritaRasa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-header {
      padding: var(--sp-8) var(--sp-6) var(--sp-6);
      text-align: center;
      background: linear-gradient(160deg, var(--clr-surface-2) 0%, var(--clr-bg) 100%);
    }
    .logo-mark {
      width: 64px;
      height: 64px;
      background: var(--clr-primary);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--sp-4);
    }
    .logo-mark i { color: #fff; font-size: 1.75rem; }
    .logo-name {
      font-family: var(--ff-display);
      font-size: var(--fz-2xl);
      font-weight: 700;
      color: var(--clr-primary);
      letter-spacing: -0.02em;
    }
    .logo-name span { font-style: italic; color: var(--clr-accent); }
    .auth-sub { color: var(--clr-text-2); font-size: var(--fz-sm); margin-top: var(--sp-2); }
    .auth-body { padding: var(--sp-5) var(--sp-5) var(--sp-8); }
    .social-row { display: flex; gap: var(--sp-3); margin-top: var(--sp-4); }
    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      padding: 0.75rem;
      border: 1.5px solid var(--clr-border);
      border-radius: var(--radius-md);
      font-size: var(--fz-sm);
      font-weight: 600;
      color: var(--clr-text);
      background: var(--clr-surface);
      cursor: pointer;
      transition: all var(--transition);
    }
    .social-btn:hover { border-color: var(--clr-text-3); }
    .divider-text {
      display: flex;
      align-items: center;
      gap: var(--sp-3);
      margin: var(--sp-4) 0;
      color: var(--clr-text-3);
      font-size: var(--fz-xs);
    }
    .divider-text::before, .divider-text::after {
      content: ''; flex: 1; height: 1px; background: var(--clr-border);
    }
    .pw-wrapper { position: relative; }
    .pw-wrapper input { padding-right: 2.75rem; }
    .toggle-pw {
      position: absolute;
      right: var(--sp-3);
      top: 50%;
      transform: translateY(-50%);
      color: var(--clr-text-3);
      font-size: 1.1rem;
      line-height: 1;
    }
    .auth-switch {
      text-align: center;
      margin-top: var(--sp-5);
      font-size: var(--fz-sm);
      color: var(--clr-text-2);
    }
    .auth-switch a { color: var(--clr-primary); font-weight: 600; }
    .hidden { display: none !important; }
    .form-group + .form-group { margin-top: var(--sp-4); }
    .lang-bar { display: flex; justify-content: flex-end; padding: var(--sp-3) var(--sp-5) 0; }
  </style>
</head>
<body>
<div class="page-wrapper">
  <div class="lang-bar">
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="id">ID</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>
  </div>

  <div class="auth-header">
    <div class="logo-mark"><i class="bi bi-fire"></i></div>
    <div class="logo-name">Cerita<span>Rasa</span></div>
    <p class="auth-sub" data-i18n="welcome_sub">Jelajahi, masak, dan lestarikan kuliner Nusantara.</p>
  </div>

  <div class="auth-body">
    <div class="tabs mb-4">
      <button class="tab-btn active" id="tab-login" data-i18n="login">Masuk</button>
      <button class="tab-btn" id="tab-register" data-i18n="register">Daftar</button>
    </div>

    <form id="form-login" autocomplete="on">
      <div class="form-group">
        <label class="form-label" data-i18n="email">Email</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input class="form-input" name="email" type="email" data-i18n-ph="email" placeholder="Email" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="password">Kata Sandi</label>
        <div class="pw-wrapper">
          <input class="form-input" name="password" type="password" data-i18n-ph="password" placeholder="Kata Sandi" required style="padding-right:2.75rem;">
          <button type="button" class="toggle-pw"><i class="bi bi-eye"></i></button>
        </div>
        <div style="text-align:right;margin-top:4px;">
          <a href="#" style="font-size:var(--fz-xs);color:var(--clr-primary);font-weight:500;" data-i18n="forgot_pw">Lupa kata sandi?</a>
        </div>
      </div>
      <button class="btn btn-primary btn-full mt-6" type="submit" data-i18n="login">Masuk</button>
      <div class="divider-text" data-i18n="or_with">atau masuk dengan</div>
      <div class="social-row">
        <button type="button" class="social-btn" onclick="App.toast('Segera hadir','')"><i class="bi bi-google" style="color:#EA4335;"></i> Google</button>
        <button type="button" class="social-btn" onclick="App.toast('Segera hadir','')"><i class="bi bi-apple"></i> Apple</button>
      </div>
    </form>

    <form id="form-register" class="hidden" autocomplete="on">
      <div class="form-group">
        <label class="form-label" data-i18n="name">Nama Lengkap</label>
        <div class="input-wrapper">
          <i class="bi bi-person input-icon"></i>
          <input class="form-input" name="name" type="text" data-i18n-ph="name" placeholder="Nama Lengkap" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="email">Email</label>
        <div class="input-wrapper">
          <i class="bi bi-envelope input-icon"></i>
          <input class="form-input" name="email" type="email" data-i18n-ph="email" placeholder="Email" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="password">Kata Sandi</label>
        <div class="pw-wrapper">
          <input class="form-input" name="password" type="password" data-i18n-ph="password" placeholder="Kata Sandi" required style="padding-right:2.75rem;">
          <button type="button" class="toggle-pw"><i class="bi bi-eye"></i></button>
        </div>
      </div>
      <button class="btn btn-primary btn-full mt-6" type="submit" data-i18n="register">Daftar</button>
    </form>

    <button class="btn btn-outline btn-full" id="btn-guest" style="margin-top:var(--sp-3);" data-i18n="guest">Lanjut sebagai Tamu</button>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
